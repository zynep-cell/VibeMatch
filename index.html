<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMatch | Daily English Ritual</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
</head>
<body>

    <main class="app-container">
        <header class="vibe-header">
            <h1>VibeMatch</h1>
            <p class="subtitle">Bugünün tınısını ve modunu belirle.</p>
            
            <!-- Mood Selector: Günlük enerjini seçtiğin alan -->
            <div class="mood-selector">
                <button class="mood-btn" onclick="setMood('serene', '#f8f9fa')">🌿 Serene</button>
                <button class="mood-btn" onclick="setMood('energetic', '#fffcf2')">⚡ Energetic</button>
                <button class="mood-btn" onclick="setMood('melancholy', '#e5e5e5')">☁️ Melancholy</button>
                <button class="mood-btn" onclick="setMood('focus', '#edf2f4')">🎯 Focus</button>
            </div>
        </header>

        <!-- Kelime Kartları Alanı -->
        <section id="cards-container" class="cards-grid">
            <!-- Kartlar JavaScript ile buraya gelecek -->
        </section>

        <div class="ritual-action">
            <button id="complete-btn" class="main-btn">Ritüeli Tamamla</button>
        </div>

        <hr class="divider">

        <!-- Zaman Tüneli: Geçmiş Kayıtların Listelendiği Alan -->
        <section class="timeline-section">
            <h2>The Soul Log</h2>
            <div id="timeline-container" class="timeline-grid">
                <!-- Kayıtlar otomatik olarak buraya eklenecek -->
            </div>
            <button id="clear-log" class="clear-btn" onclick="clearLogs()">Arşivi Temizle</button>
        </section>
    </main>

    <!-- Modal: Başarı Mesajı -->
    <div id="finish-modal" class="modal hidden">
        <div class="modal-content">
            <p id="modal-text"></p>
            <button onclick="closeModal()" class="close-btn">Devam Et</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
