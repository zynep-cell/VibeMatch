<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMatch | Daily English Ritual</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
</head>
<body>

    <main class="app-container">
        <header class="vibe-header">
            <h1>VibeMatch</h1>
            <p class="subtitle">Bugünün tınısını ve modunu belirle.</p>
            
            <div class="mood-selector">
                <button class="mood-btn" onclick="setMood('#f8f9fa')">🌿 Serene</button>
                <button class="mood-btn" onclick="setMood('#fffcf2')">⚡ Energetic</button>
                <button class="mood-btn" onclick="setMood('#e5e5e5')">☁️ Melancholy</button>
                <button class="mood-btn" onclick="setMood('#edf2f4')">🎯 Focus</button>
            </div>
        </header>

        <section id="cards-container" class="cards-grid">
            <!-- Kartlar JS ile gelecek -->
        </section>

        <div class="ritual-action">
            <button id="complete-btn" class="main-btn">Ritüeli Tamamla & Arşive Ekle</button>
        </div>

        <hr class="divider">

        <section class="timeline-section">
            <h2>The Soul Log</h2>
            <div id="timeline-container" class="timeline-grid">
                <!-- Kayıtlar buraya gelecek -->
            </div>
            <button class="clear-btn" onclick="clearLogs()">Arşivi Temizle</button>
        </section>
    </main>

    <!-- Modal Yapısı -->
    <div id="finish-modal" class="modal-overlay">
        <div class="modal-content">
            <p id="modal-text"></p>
            <button id="close-modal-btn" class="close-btn">Devam Et</button>
        </div>
    </div>

    <script src="script.js"></script>
<!-- Mini Gezgin Menü -->
<div id="zen-navigator">
    <button class="nav-trigger">✦</button>
    <div class="nav-content">
        <a href="https://zynep-cell.github.io/the-core-zen/">🏠 Ana Menü</a>
        <a href="https://zynep-cell.github.io/neurovibe/">🧠 NeuroVibe</a>
        <a href="https://zynep-cell.github.io/VibeMatch/">🔤 VibeMatch</a>
        <a href="https://zynep-cell.github.io/VibeMotto/">📖 VibeMotto</a>
    </div>
</div>

<style>
    #zen-navigator {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        font-family: 'Quicksand', sans-serif;
    }

    .nav-trigger {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(0,0,0,0.1);
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        color: #5a6b7d;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: transform 0.3s;
    }

    .nav-content {
        display: none;
        position: absolute;
        bottom: 55px;
        right: 0;
        background: white;
        padding: 10px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 150px;
        flex-direction: column;
        gap: 8px;
    }

    .nav-content a {
        text-decoration: none;
        color: #5a6b7d;
        font-size: 0.85rem;
        padding: 8px;
        border-radius: 8px;
        transition: background 0.2s;
    }

    .nav-content a:hover {
        background: #f0f4f8;
    }

    #zen-navigator:hover .nav-content {
        display: flex;
    }

    #zen-navigator:hover .nav-trigger {
        transform: rotate(90deg);
    }
</style>
</body>
</html>
